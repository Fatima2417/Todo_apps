openapi: 3.0.3
info:
  title: Todo Task API - Phase 5A Advanced Features
  version: 2.0.0
  description: Extended Task API with priorities, tags, search, filter, sort, recurring tasks, and reminders

servers:
  - url: http://localhost:8000
    description: Local development
  - url: http://todo-backend.minikube.local
    description: Minikube deployment

paths:
  /api/{user_id}/tasks:
    get:
      summary: List tasks with advanced filtering and search
      operationId: listTasks
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
          description: User ID (must match authenticated user)
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: Search query (searches title and description)
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, completed]
            default: all
          description: Filter by completion status
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high]
          description: Filter by priority level
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by tags (multiple allowed)
        - name: due_date_from
          in: query
          schema:
            type: string
            format: date-time
          description: Filter tasks with due date >= this value
        - name: due_date_to
          in: query
          schema:
            type: string
            format: date-time
          description: Filter tasks with due date <= this value
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, due_date, priority, title, completed_at]
            default: created_at
          description: Sort field
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Items per page
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  total:
                    type: integer
                    description: Total number of tasks matching filters
                  page:
                    type: integer
                  page_size:
                    type: integer
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (user_id mismatch)

    post:
      summary: Create a new task
      operationId: createTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /api/{user_id}/tasks/{task_id}:
    get:
      summary: Get task by ID
      operationId: getTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

    put:
      summary: Update task
      operationId: updateTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Validation error
        '404':
          description: Task not found

    delete:
      summary: Delete task
      operationId: deleteTask
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted
        '404':
          description: Task not found

  /api/{user_id}/tasks/{task_id}/complete:
    patch:
      summary: Toggle task completion status
      operationId: toggleTaskCompletion
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
        - name: task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task completion toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

  /api/{user_id}/tasks/tags:
    get:
      summary: Get all unique tags for user (for autocomplete)
      operationId: getUserTags
      tags:
        - Tasks
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of unique tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: string

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          example: 123
        user_id:
          type: integer
          example: 456
        title:
          type: string
          maxLength: 200
          example: "Finish quarterly report"
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: "Complete Q1 2026 financial report with charts"
        is_completed:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: "2026-03-05T21:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-03-05T21:00:00Z"
        completed_at:
          type: string
          format: date-time
          nullable: true
          example: null
        priority:
          type: string
          enum: [low, medium, high]
          example: "high"
        tags:
          type: array
          items:
            type: string
          maxItems: 20
          example: ["work", "finance", "deadline"]
        due_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-31T17:00:00Z"
        remind_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-31T09:00:00Z"
        recurring_pattern:
          type: string
          nullable: true
          maxLength: 100
          example: "monthly"
        is_recurring:
          type: boolean
          example: false
        parent_task_id:
          type: integer
          nullable: true
          example: null

    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: "Finish quarterly report"
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: "Complete Q1 2026 financial report"
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
          example: "high"
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
          default: []
          example: ["work", "finance"]
        due_date:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-31T17:00:00Z"
        remind_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-03-31T09:00:00Z"
        recurring_pattern:
          type: string
          nullable: true
          maxLength: 100
          example: "monthly"

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        due_date:
          type: string
          format: date-time
          nullable: true
        remind_at:
          type: string
          format: date-time
          nullable: true
        recurring_pattern:
          type: string
          nullable: true
          maxLength: 100

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []
