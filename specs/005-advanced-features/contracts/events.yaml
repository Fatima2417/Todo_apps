## Error Handling

### Event Publishing Failures

- Log error with full event details
- Do NOT block user action (fire-and-forget pattern)
- Monitor failure rate (alert if >1%)
- Retry not implemented (accept eventual consistency)

### Event Consumption Failures

- Dapr handles retries automatically (exponential backoff)
- Dead letter queue after 3 retries
- Manual intervention required for DLQ messages
- Idempotent handlers (use event_id to detect duplicates)

## Monitoring & Observability

### Metrics to Track

- Events published per type (counter)
- Event publishing failures (counter)
- Event processing latency (histogram)
- Consumer lag (gauge)
- Dead letter queue size (gauge)

### Logging

- Log all published events at INFO level
- Log all consumed events at INFO level
- Log failures at ERROR level with full context
- Include event_id in all log messages for tracing

## Schema Evolution

### Adding New Fields (Backward Compatible)

1. Add optional field to event data
2. Increment patch version (v1.1)
3. Update this document
4. Deploy consumers first (can ignore new field)
5. Deploy producers (start sending new field)

### Breaking Changes (Not Backward Compatible)

1. Create new event type with incremented major version (v2)
2. Deploy consumers for v2 events
3. Deploy producers to send both v1 and v2 (dual-write period)
4. Monitor v1 consumer lag until zero
5. Remove v1 event publishing
6. Deprecate v1 consumers after 30 days

