## Event Publishing Pattern

### Backend Service (FastAPI)

```python
import httpx
from datetime import datetime
import uuid

async def publish_event(event_type: str, user_id: int, task_id: int, data: dict):
    """
    Publish event to Kafka via Dapr Pub/Sub
    """
    event = {
        "event_id": str(uuid.uuid4()),
        "event_type": event_type,
        "event_version": "v1",
        "timestamp": datetime.utcnow().isoformat() + "Z",
        "user_id": user_id,
        "task_id": task_id,
        "data": data
    }

    async with httpx.AsyncClient() as client:
        try:
            response = await client.post(
                "http://localhost:3500/v1.0/publish/pubsub/task-events",
                json=event,
                timeout=5.0
            )
            response.raise_for_status()
        except Exception as e:
            # Log error but don't block user action
            logger.error(f"Failed to publish event {event_type}: {e}")

# Usage in endpoint
@app.post("/api/{user_id}/tasks")
async def create_task(user_id: int, task: TaskCreate):
    # Create task in database
    new_task = await task_service.create(user_id, task)

    # Publish event
    await publish_event(
        event_type="task.created.v1",
        user_id=user_id,
        task_id=new_task.id,
        data={
            "title": new_task.title,
            "description": new_task.description,
            "priority": new_task.priority,
            "tags": new_task.tags,
            "due_date": new_task.due_date.isoformat() if new_task.due_date else None,
            "remind_at": new_task.remind_at.isoformat() if new_task.remind_at else None,
            "recurring_pattern": new_task.recurring_pattern,
            "is_recurring": new_task.is_recurring,
            "parent_task_id": new_task.parent_task_id
        }
    )

    return new_task
```

## Event Consumption Pattern

### Microservice (Recurring Task Service)

```python
from fastapi import FastAPI
from pydantic import BaseModel

app = FastAPI()

class CloudEvent(BaseModel):
    id: str
    source: str
    type: str
    datacontenttype: str
    data: dict

@app.post("/task-completed")
async def handle_task_completed(event: CloudEvent):
    """
    Dapr subscription endpoint for task.completed.v1 events
    """
    if event.type != "task.completed.v1":
        return {"status": "ignored"}

    data = event.data

    # Check if recurring
    if not data.get("is_recurring"):
        return {"status": "not_recurring"}

    # Calculate next occurrence
    next_due_date = calculate_next_occurrence(
        data["due_date"],
        data["recurring_pattern"]
    )

    # Create new task
    new_task = await create_recurring_task(
        user_id=data["user_id"],
        original_task_id=data["task_id"],
        title=data["title"],
        due_date=next_due_date,
        recurring_pattern=data["recurring_pattern"]
    )

    # Publish recurring.completed event
    await publish_event(
        event_type="task.recurring.completed.v1",
        user_id=data["user_id"],
        task_id=new_task.id,
        data={
            "original_task_id": data["task_id"],
            "original_title": data["title"],
            "new_task_id": new_task.id,
            "new_due_date": next_due_date.isoformat(),
            "recurring_pattern": data["recurring_pattern"]
        }
    )

    return {"status": "processed", "new_task_id": new_task.id}
```

