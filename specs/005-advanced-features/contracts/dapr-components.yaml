## Installation Steps

### 1. Install Dapr on Minikube

```bash
# Install Dapr CLI
wget -q https://raw.githubusercontent.com/dapr/cli/master/install/install.sh -O - | /bin/bash

# Initialize Dapr on Minikube
dapr init --kubernetes --wait

# Verify installation
dapr status -k
```

### 2. Apply Dapr Components

```bash
# Apply all components
kubectl apply -f helm/todo-backend/templates/dapr-components/

# Verify components
kubectl get components -n default
```

### 3. Deploy Services with Dapr Sidecars

```bash
# Backend
helm install todo-backend ./helm/todo-backend

# Microservices
helm install recurring-task-service ./helm/recurring-task-service
helm install notification-service ./helm/notification-service
helm install audit-service ./helm/audit-service

# Verify sidecars injected
kubectl get pods -n default
# Should see 2/2 READY (app + sidecar)
```

