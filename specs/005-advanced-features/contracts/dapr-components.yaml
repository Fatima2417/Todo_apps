## Troubleshooting

### Sidecar Not Injected

```bash
# Check Dapr installation
dapr status -k

# Check pod annotations
kubectl describe pod <pod-name>

# Check Dapr logs
kubectl logs <pod-name> -c daprd
```

### Pub/Sub Not Working

```bash
# Check Kafka connectivity
kubectl exec -it <pod-name> -c daprd -- curl http://localhost:3500/v1.0/metadata

# Check component status
kubectl get component pubsub -o yaml

# Check Kafka broker
kubectl get kafka -n kafka
```

### Jobs Not Triggering

```bash
# Check Dapr Jobs API availability
curl http://localhost:3500/v1.0-alpha1/jobs

# Check state store connectivity
kubectl logs <pod-name> -c daprd | grep state

# Verify job was scheduled
kubectl logs <pod-name> -c daprd | grep "job scheduled"
```

---

## Security Considerations

### Local Development

- No mTLS (disabled for simplicity)
- No Kafka authentication (local cluster)
- Secrets in Kubernetes secrets (not encrypted at rest)
- Open access control (all services can call each other)

### Production (Phase 5B)

- Enable mTLS for service-to-service communication
- Enable Kafka SASL/SSL authentication
- Use external secret store (Azure Key Vault, AWS Secrets Manager)
- Implement access control policies
- Enable Dapr API token authentication

---

## Monitoring

### Dapr Metrics

```bash
# Port-forward to Dapr metrics endpoint
kubectl port-forward <pod-name> 9090:9090

# Query metrics
curl http://localhost:9090/metrics
```

**Key Metrics**:
- `dapr_component_loaded`: Component initialization status
- `dapr_pubsub_ingress_count`: Events received
- `dapr_pubsub_egress_count`: Events published
- `dapr_state_operation_count`: State operations
- `dapr_sidecar_injected`: Sidecar injection count

