## Dapr Jobs API Usage

### Schedule Reminder Job

```python
import httpx
from datetime import datetime

async def schedule_reminder(task_id: int, user_id: int, remind_at: datetime):
    """
    Schedule a reminder using Dapr Jobs API (alpha)
    """
    job_id = f"reminder-{task_id}"

    async with httpx.AsyncClient() as client:
        response = await client.post(
            "http://localhost:3500/v1.0-alpha1/jobs/reminders",
            json={
                "schedule": remind_at.isoformat(),
                "data": {
                    "task_id": task_id,
                    "user_id": user_id
                },
                "dueTime": remind_at.isoformat()
            }
        )
        response.raise_for_status()
        return job_id
```

### Cancel Reminder Job

```python
async def cancel_reminder(task_id: int):
    """
    Cancel a scheduled reminder
    """
    job_id = f"reminder-{task_id}"

    async with httpx.AsyncClient() as client:
        response = await client.delete(
            f"http://localhost:3500/v1.0-alpha1/jobs/reminders/{job_id}"
        )
        response.raise_for_status()
```

### Job Handler Endpoint

```python
from fastapi import FastAPI

app = FastAPI()

@app.post("/jobs/reminder-handler")
async def handle_reminder(job_data: dict):
    """
    Dapr Jobs callback endpoint
    """
    task_id = job_data["data"]["task_id"]
    user_id = job_data["data"]["user_id"]

    # Fetch task details
    task = await get_task(task_id)

    # Publish reminder.due event
    await publish_event(
        event_type="reminder.due.v1",
        user_id=user_id,
        task_id=task_id,
        data={
            "title": task.title,
            "due_date": task.due_date.isoformat(),
            "priority": task.priority,
            "tags": task.tags,
            "hours_until_due": calculate_hours_until_due(task.due_date)
        }
    )

    return {"status": "processed"}
```

