# Dapr Components Configuration

**Feature**: 005-advanced-features
**Date**: 2026-03-05
**Version**: 1.0.0

## Overview

This document defines Dapr component configurations for Phase 5A. All components are deployed to Minikube and configured for local development.

## Component Definitions

### 1. Pub/Sub Component (Kafka)

**File**: `helm/todo-backend/templates/dapr-components/pubsub.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: default
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "todo-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
    - name: authRequired
      value: "false"
    - name: consumerGroup
      value: "todo-app"
    - name: clientId
      value: "todo-backend"
    - name: maxMessageBytes
      value: "1048576"  # 1MB
    - name: version
      value: "2.8.0"
scopes:
  - todo-backend
  - recurring-task-service
  - notification-service
  - audit-service
```

**Configuration Notes**:
- Connects to Strimzi Kafka cluster in `kafka` namespace
- No authentication (local development only)
- Consumer group per service for load balancing
- 1MB max message size (sufficient for task events)

---

### 2. State Store Component (PostgreSQL)

**File**: `helm/todo-backend/templates/dapr-components/statestore.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: default
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      secretKeyRef:
        name: todo-secrets
        key: DATABASE_URL
    - name: tableName
      value: "dapr_state"
    - name: metadataTableName
      value: "dapr_state_metadata"
    - name: timeoutInSeconds
      value: "30"
scopes:
  - todo-backend
  - recurring-task-service
```

**Configuration Notes**:
- Uses existing Neon PostgreSQL database
- Connection string from Kubernetes secret
- Separate tables for Dapr state (not mixed with app tables)
- Used for Dapr Jobs persistence

---

### 3. Secrets Component (Kubernetes)

**File**: `helm/todo-backend/templates/dapr-components/secrets.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kubernetes-secrets
  namespace: default
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    - name: vaultName
      value: "todo-secrets"
scopes:
  - todo-backend
  - recurring-task-service
  - notification-service
  - audit-service
```

**Configuration Notes**:
- Reads from Kubernetes secrets
- All services can access secrets via Dapr API
- Secrets include: DATABASE_URL, COHERE_API_KEY, JWT_SECRET

---

### 4. Configuration Component (Kubernetes ConfigMap)

**File**: `helm/todo-backend/templates/dapr-components/configuration.yaml`

```yaml
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: dapr-config
  namespace: default
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin.default.svc.cluster.local:9411/api/v2/spans"
  metric:
    enabled: true
  mtls:
    enabled: false  # Disabled for local development
  accessControl:
    defaultAction: allow
    trustDomain: "public"
```

**Configuration Notes**:
- Tracing enabled for debugging (optional Zipkin)
- Metrics enabled for monitoring
- mTLS disabled (local development)
- Open access control (no restrictions)

