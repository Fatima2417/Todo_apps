apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recurring-task-service.fullname" . }}
  labels:
    app: {{ include "recurring-task-service.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "recurring-task-service.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "recurring-task-service.name" . }}
      annotations:
        dapr.io/enabled: "{{ .Values.dapr.enabled }}"
        dapr.io/app-id: "{{ .Values.dapr.appId }}"
        dapr.io/app-port: "{{ .Values.dapr.appPort }}"
        dapr.io/log-level: "{{ .Values.dapr.logLevel }}"
        dapr.io/config: "{{ .Values.dapr.config }}"
    spec:
      containers:
      - name: recurring-task-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
